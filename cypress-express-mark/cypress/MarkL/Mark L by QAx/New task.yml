http:
  method: POST
  url: http://localhost:3333/tasks
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
      	"name": "Comprar ketchup",
      	"is_done": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
